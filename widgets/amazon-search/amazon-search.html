<link
  rel="stylesheet"
  href="https://aukiman.github.io/aukihenry-assets/widgets/amazon-search/amazon-search.css"
/>

<div class="auki-amazon-search">

  <div class="auki-amazon-title">
    Find it on Amazon Australia
  </div>

  <div class="auki-amazon-subtitle">
    Search Amazon for products, tools and useful gear.
  </div>

  <form
    class="auki-amazon-form"
    action="https://www.amazon.com.au/s"
    method="get"
    target="_blank"
  >

    <input
      class="auki-amazon-input"
      type="text"
      name="k"
      placeholder="What are you looking for?"
      aria-label="Search Amazon Australia"
      required
    />

    <input
      type="hidden"
      name="tag"
      value="auki04-22"
    />

    <button
      class="auki-amazon-button"
      type="submit"
    >
      Search Amazon
    </button>

  </form>

  <div class="auki-amazon-disclosure">
    As an Amazon Associate I earn from qualifying purchases.
  </div>

</div>
